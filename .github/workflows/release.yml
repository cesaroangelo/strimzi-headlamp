name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "📦 Release version: $VERSION"

      - name: Verify package.json version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${{ steps.version.outputs.version }}
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Version mismatch!"
            echo "   package.json: $PACKAGE_VERSION"
            echo "   Tag: $TAG_VERSION"
            exit 1
          fi
          echo "✅ Version match: $PACKAGE_VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build plugin
        run: npm run build

      - name: Package plugin
        run: npm run package

      - name: Calculate checksum
        id: checksum
        run: |
          TARBALL=$(ls *strimzi-headlamp-*.tar.gz)
          CHECKSUM=$(shasum -a 256 "$TARBALL" | cut -d' ' -f1)
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "📋 Checksum: $CHECKSUM"
          echo "📦 Tarball: $TARBALL"

      # Each release gets its own directory. Nothing is ever rewritten, so
      # Artifact Hub can never read a file that names one version while still
      # pointing at the previous release's archive. It also keeps the version
      # history visible on the package page.
      - name: Write Artifact Hub metadata for this release
        run: |
          VERSION=${{ steps.version.outputs.version }}
          PREVIOUS=$(ls -d */artifacthub-pkg.yml 2>/dev/null | sort -V | tail -1)
          if [ -z "$PREVIOUS" ]; then
            echo "::error::no existing artifacthub-pkg.yml to copy from"
            exit 1
          fi
          echo "Copying metadata from $PREVIOUS"

          mkdir -p "$VERSION"
          cp "$PREVIOUS" "$VERSION/artifacthub-pkg.yml"

          ARCHIVE_URL="https://github.com/${{ github.repository }}/releases/download/v${VERSION}/${{ steps.checksum.outputs.tarball }}"
          CHECKSUM="sha256:${{ steps.checksum.outputs.checksum }}"
          TARGET="$VERSION/artifacthub-pkg.yml"

          sed -i "s/^version: .*/version: ${VERSION}/" "$TARGET"
          sed -i "s/^createdAt: .*/createdAt: $(date -u +"%Y-%m-%dT%H:%M:%SZ")/" "$TARGET"
          sed -i "s|headlamp/plugin/archive-url: .*|headlamp/plugin/archive-url: ${ARCHIVE_URL}|" "$TARGET"
          sed -i "s|headlamp/plugin/archive-checksum: .*|headlamp/plugin/archive-checksum: \"${CHECKSUM}\"|" "$TARGET"

          python3 - "$TARGET" "$VERSION" <<'CHECK'
          import re, sys, yaml
          path, version = sys.argv[1], sys.argv[2]
          d = yaml.safe_load(open(path))
          assert str(d['version']) == version, f"version is {d['version']}, expected {version}"
          url = d['annotations']['headlamp/plugin/archive-url']
          assert re.search(rf'/download/v{re.escape(version)}/', url), f"archive-url is {url}"
          assert d['annotations']['headlamp/plugin/archive-checksum'].startswith('sha256:')
          print(f"{path} is complete and consistent at {version}")
          CHECK

      - name: Open and merge the metadata pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${{ steps.version.outputs.version }}
          BRANCH="chore/artifacthub-v${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "$VERSION/artifacthub-pkg.yml"
          git commit -m "Add Artifact Hub metadata for v${VERSION}"
          git push origin "$BRANCH"
          gh pr create \
            --title "Add Artifact Hub metadata for v${VERSION}" \
            --body "Written by the release workflow for v${VERSION}. The file is complete and self-consistent; merging it publishes the release to Artifact Hub." \
            --base main \
            --head "$BRANCH"
          # Merge straight away. Leaving this open is what let Artifact Hub
          # index a release whose metadata had not landed yet.
          gh pr merge "$BRANCH" --squash --delete-branch

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Strimzi Headlamp Plugin ${{ steps.version.outputs.version }}

            ### Installation

            Download the `.tar.gz` file below and extract to your Headlamp plugins directory.

            ### Checksums

            SHA-256: `${{ steps.checksum.outputs.checksum }}`

            ### What's Changed
            See [CHANGELOG.md](https://github.com/cesaroangelo/strimzi-headlamp/blob/main/CHANGELOG.md) for details.
          files: ${{ steps.checksum.outputs.tarball }}
          draft: false
          prerelease: false

      - name: Release Summary
        if: always()
        run: |
          echo "### 🚀 Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tarball:** ${{ steps.checksum.outputs.tarball }}" >> $GITHUB_STEP_SUMMARY
          echo "**Checksum:** \`${{ steps.checksum.outputs.checksum }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Release created" >> $GITHUB_STEP_SUMMARY
